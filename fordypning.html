<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KRLE Abraham – fordypning</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f1e8;color:#243238;line-height:1.55}a{color:inherit}.wrap{max-width:1040px;margin:auto;padding:18px}.hero{background:#264653;color:white;border-radius:28px;padding:32px;box-shadow:0 8px 24px #0002}.hero h1{font-size:clamp(30px,5vw,50px);margin:6px 0}.hero p{color:#d9e5e8}.tag{color:#e9c46a;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.card{background:white;border-radius:22px;padding:22px;box-shadow:0 5px 18px #0001}.tile{display:block;text-decoration:none;transition:.15s}.tile:hover{transform:translateY(-3px);box-shadow:0 8px 24px #0002}.btn,button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#264653;color:white}.green{background:#2a9d8f;color:white}.amber{background:#e9c46a;color:#243238}.outline{background:white;border:1px solid #ccd4d7}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.nav{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}.nav a{text-decoration:none;background:#fff;padding:10px 14px;border-radius:12px}.muted{color:#68777d}.hide{display:none}.progress{height:9px;background:#e3e8e8;border-radius:20px;overflow:hidden}.bar{height:100%;background:#2a9d8f}.choice{display:block;width:100%;margin:9px 0;text-align:left;background:white;border:2px solid #dde4e6}.right{border-color:#22a06b!important;background:#effbf5!important}.wrong{border-color:#dc6b6b!important;background:#fff0f0!important}.callout{background:#e9c46a33;border-radius:18px;padding:17px}.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.tabs button.active{background:#264653;color:white}.flash{width:100%;min-height:220px;background:#2a9d8f18;font-size:clamp(23px,4vw,34px);padding:28px}.qbox{border-top:1px solid #dfe5e6;padding-top:18px;margin-top:18px}textarea{width:100%;min-height:130px;border:1px solid #bdc9cd;border-radius:14px;padding:14px;font:inherit}.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800}.dark{background:#101827;color:#edf4f4}.dark .card{background:#172131}.dark .hero{background:linear-gradient(135deg,#1c2851,#102c29)}.dark .muted{color:#aebcc1}.dark .outline,.dark .choice,.dark .nav a{background:#172131;color:#edf4f4;border-color:#34424d}.dark .flash{background:#20324d}.dark textarea{background:#101827;color:white;border-color:#42505d}.dark .callout{background:#28463f}.footer{text-align:center;color:#819096;font-size:12px;padding:25px}@media(max-width:750px){.grid{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(3,1fr)}.hero{padding:24px}}
</style></head><body class="dark"><main class="wrap"><nav class="nav"><a href="index.html">← Startside</a><a href="grunnkurs.html">Grunnkurs</a><a href="prove.html">Prøve</a></nav><header class="hero"><div class="tag">NIVÅ 2 • NYTT NAVN</div><h1>Fordypning: forstå, sammenlign og drøft</h1><p>Bruk fagbegreper, se sammenhenger og begrunn svarene.</p></header><div id="app" style="margin-top:18px"></div><script>
const cases=[["Hvorfor abrahamittiske?", "En medelev sier at religionene nesten er like fordi alle har Abraham. Hva er riktig, og hva må nyanseres?", ["Felles røtter knyttet til Abraham", "Alle tre er monoteistiske", "Ulike læresetninger, tekster og tradisjoner", "Abraham forstås ikke helt likt"]], ["Pakten: mer enn et løfte", "Forklar hvorfor pakten er viktig. Bruk pakt, løfte, stamfar og etterkommere.", ["Definer pakt", "Guds løfte om en stor slekt", "Abraham som stamfar", "Betydning for senere fortellinger"]], ["Isak og Ismael", "Hvorfor er det for enkelt å knytte hver sønn bare til én religion?", ["Begge er Abrahams sønner", "Isak sentral i bibelsk paktstradisjon", "Ismael viktig i islam", "Tradisjonene overlapper"]], ["Offerhistorien", "Drøft tro, lydighet, tillit og etiske dilemmaer.", ["Abraham settes på prøve", "Bibelsk fortelling gjelder Isak", "Abraham stoppes", "Etiske spørsmål kan drøftes"]], ["Tre religioner", "Finn to likheter og to forskjeller i Abrahams betydning.", ["Felles skikkelse og monoteisme", "Jødedom: stamfar og pakt", "Kristendom: eksempel på tro", "Islam: Ibrahim, profet og forbilde"]], ["Kildebevissthet", "Hvorfor er formuleringer som «i bibelsk tradisjon» viktige?", ["Ulike teksttradisjoner", "Viser hvilken tradisjon påstanden gjelder", "Gir presisjon", "Likheter uten å skjule forskjeller"]]],quiz=[["Hva gjør et sammenligningssvar sterkt?", ["Bare likheter", "Tydelige kriterier, likheter og forskjeller", "Lengst mulig tekst"], 1], ["Hva viser kildebevissthet?", ["Markere hvilken tradisjon en påstand hører til", "Si at alt er likt", "Bare egne meninger"], 0], ["Hva betyr drøfte?", ["Gjengi ett faktum", "Belyse flere sider og begrunne", "Skrive punktliste"], 1], ["Beste avslutning?", ["Religionene er like", "Abraham er felles, men betydning og vektlegging varierer", "Det finnes ingen forskjeller"], 1], ["Aktiv bruk av fagbegrep?", ["Skrive ordet", "Definere og bruke det til å forklare sammenheng", "Gjenta ordet"], 1], ["Godt svar om offerhistorien?", ["Bare handlingsreferat", "Tolkning av tro og lydighet samt etiske spørsmål", "Ingen spørsmål å diskutere"], 1]];let view='home',i=0,show=false,pick=null,score=0;const app=document.getElementById('app');function render(){if(view==='home')app.innerHTML=`<section class="grid"><button class="card" onclick="view='cases';render()"><h2>⚖️ Seks utfordringer</h2><p>Forklar, sammenlign og drøft.</p></button><button class="card" onclick="start()"><h2>🧠 Fordypningstest</h2><p>Spørsmål om metode og presisjon.</p></button><a class="card tile" href="prove.html"><h2>📝 Gå til prøven</h2><p>Test kunnskapen uten fasit underveis.</p></a></section>`;else if(view==='cases'){let c=cases[i];app.innerHTML=`<div class="tabs">${cases.map((_,x)=>`<button class="${i===x?'active':''}" onclick="i=${x};show=false;render()">${x+1}</button>`).join('')}</div><section class="card" style="margin-top:12px"><div class="tag">UTFORDRING ${i+1}</div><h2>${c[0]}</h2><div class="callout">${c[1]}</div><p>Prøv først muntlig eller på papir.</p><button class="green" onclick="show=!show;render()">${show?'Skjul':'Vis'} nøkkelpunkter</button>${show?`<ul>${c[2].map(x=>`<li>${x}</li>`).join('')}</ul>`:''}<div class="row"><button class="outline" onclick="view='home';render()">Forsiden</button></div></section>`}else if(view==='quiz'){let q=quiz[i];app.innerHTML=`<section class="card"><p>Spørsmål ${i+1}/${quiz.length}</p><h2>${q[0]}</h2>${q[1].map((o,x)=>`<button class="choice ${pick===null?'':x===q[2]?'right':pick===x?'wrong':''}" onclick="choose(${x})">${o}</button>`).join('')}${pick!==null?`<button class="green" onclick="next()">Neste →</button>`:''}</section>`}else app.innerHTML=`<section class="card"><h2>${score}/${quiz.length} riktig</h2><p>${score>=5?'Du er klar for prøve.':'Gå gjennom utfordringene én gang til.'}</p><a class="btn green" href="prove.html">Start realistisk prøve</a></section>`}function start(){view='quiz';i=0;pick=null;score=0;render()}function choose(x){if(pick!==null)return;pick=x;if(x===quiz[i][2])score++;render()}function next(){if(i+1===quiz.length)view='result';else{i++;pick=null}render()}render();</script><div class="footer">KRLE-opplegg for 8. klasse • Abraham og de abrahamittiske religionene</div></main></body></html>
