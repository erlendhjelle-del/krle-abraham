<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KRLE Abraham – grunnkurs</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f1e8;color:#243238;line-height:1.55}a{color:inherit}.wrap{max-width:1040px;margin:auto;padding:18px}.hero{background:#264653;color:white;border-radius:28px;padding:32px;box-shadow:0 8px 24px #0002}.hero h1{font-size:clamp(30px,5vw,50px);margin:6px 0}.hero p{color:#d9e5e8}.tag{color:#e9c46a;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.card{background:white;border-radius:22px;padding:22px;box-shadow:0 5px 18px #0001}.tile{display:block;text-decoration:none;transition:.15s}.tile:hover{transform:translateY(-3px);box-shadow:0 8px 24px #0002}.btn,button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#264653;color:white}.green{background:#2a9d8f;color:white}.amber{background:#e9c46a;color:#243238}.outline{background:white;border:1px solid #ccd4d7}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.nav{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}.nav a{text-decoration:none;background:#fff;padding:10px 14px;border-radius:12px}.muted{color:#68777d}.hide{display:none}.progress{height:9px;background:#e3e8e8;border-radius:20px;overflow:hidden}.bar{height:100%;background:#2a9d8f}.choice{display:block;width:100%;margin:9px 0;text-align:left;background:white;border:2px solid #dde4e6}.right{border-color:#22a06b!important;background:#effbf5!important}.wrong{border-color:#dc6b6b!important;background:#fff0f0!important}.callout{background:#e9c46a33;border-radius:18px;padding:17px}.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.tabs button.active{background:#264653;color:white}.flash{width:100%;min-height:220px;background:#2a9d8f18;font-size:clamp(23px,4vw,34px);padding:28px}.qbox{border-top:1px solid #dfe5e6;padding-top:18px;margin-top:18px}textarea{width:100%;min-height:130px;border:1px solid #bdc9cd;border-radius:14px;padding:14px;font:inherit}.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800}.dark{background:#101827;color:#edf4f4}.dark .card{background:#172131}.dark .hero{background:linear-gradient(135deg,#1c2851,#102c29)}.dark .muted{color:#aebcc1}.dark .outline,.dark .choice,.dark .nav a{background:#172131;color:#edf4f4;border-color:#34424d}.dark .flash{background:#20324d}.dark textarea{background:#101827;color:white;border-color:#42505d}.dark .callout{background:#28463f}.footer{text-align:center;color:#819096;font-size:12px;padding:25px}@media(max-width:750px){.grid{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(3,1fr)}.hero{padding:24px}}
</style></head><body class=""><main class="wrap"><nav class="nav"><a href="index.html">← Startside</a><a href="fordypning.html">Fordypning</a><a href="prove.html">Prøve</a></nav><header class="hero"><div class="tag">NIVÅ 1</div><h1>Grunnkurs: forstå og husk</h1><p>Seks temaer, begrepskort og en kort test.</p></header><div id="app" style="margin-top:18px"></div><script>
const topics=[["Abrahamittiske religioner", "Jødedom, kristendom og islam kalles abrahamittiske religioner fordi Abraham har en viktig plass i alle tre tradisjonene.", "Alle tre er monoteistiske; de deler røtter knyttet til Abraham; de har også ulike tekster og tradisjoner."], ["Historien om Abraham", "Gud kaller Abraham, og Abraham reiser videre med familien sin. Fortellingen handler om tro, tillit, løfter og slekt.", "Abraham følger kallet; Gud lover en stor slekt; Abraham regnes som stamfar."], ["Pakten", "En pakt er en avtale eller et løfte mellom parter. Pakten knytter Gud, Abraham og etterkommerne sammen.", "Forklar både hva pakt betyr og hva Gud lover Abraham."], ["Isak og Ismael", "Isak og Ismael er sønner av Abraham. Tradisjonene legger ulik vekt på deres roller.", "Isak står sentralt i bibelsk pakt- og slektstradisjon; Ismael har en viktig plass i islam."], ["Offerhistorien", "I den bibelske fortellingen blir Abraham bedt om å ofre Isak, men blir stoppet før offeret.", "Fortellingen kan knyttes til tro, lydighet, tillit og etiske spørsmål."], ["Abraham i tre religioner", "Abraham er felles, men forstås og vektlegges ulikt.", "Jødedom: stamfar og pakt. Kristendom: eksempel på tro. Islam: Ibrahim, profet og forbilde."]],terms=[["Monoteisme", "Tro på én Gud."], ["Pakt", "En avtale eller et løfte mellom parter."], ["Stamfar", "Opphav til en slekt eller et folk."], ["Profet", "En person som formidler et budskap fra Gud."], ["Åpenbaring", "At noe guddommelig blir gjort kjent."], ["Tradisjon", "Måter tro og fortellinger overleveres og forstås på."]],quiz=[["Hva betyr monoteisme?", ["Tro på én Gud", "Tro på mange guder", "Ingen tro"], 0], ["Hva er en pakt?", ["En høytid", "Et løfte eller en avtale", "En bygning"], 1], ["Hvem er Isak og Ismael?", ["Abrahams sønner", "Konger", "Mosebøker"], 0], ["Hva kalles Abraham i islam?", ["Ibrahim", "David", "Jakob"], 0], ["Hva er viktig med offerhistorien?", ["Abraham blir satt på prøve og stoppet før offeret", "Abraham blir konge", "Moses griper inn"], 0], ["Hva er felles for de tre religionene?", ["De er monoteistiske og knytter seg til Abraham", "De har identiske tekster", "De oppstod samtidig"], 0]];let view='home',i=0,flip=false,pick=null,score=0;const app=document.getElementById('app');
function render(){if(view==='home')app.innerHTML=`<section class="grid"><button class="card" onclick="view='topics';i=0;render()"><h2>📖 Seks temaer</h2><p>Les og forklar med egne ord.</p></button><button class="card" onclick="view='terms';i=0;flip=false;render()"><h2>⭐ Begrepskort</h2><p>Øv på sentrale fagord.</p></button><button class="card" onclick="start()"><h2>✅ Kunnskapstest</h2><p>${quiz.length} spørsmål.</p></button></section>`;else if(view==='topics'){let t=topics[i];app.innerHTML=`<div class="tabs">${topics.map((_,x)=>`<button class="${x===i?'active':''}" onclick="i=${x};render()">${x+1}</button>`).join('')}</div><article class="card" style="margin-top:12px"><div class="tag">TEMA ${i+1}</div><h2>${t[0]}</h2><p>${t[1]}</p><div class="callout"><b>Dette bør sitte:</b><p>${t[2]}</p></div><div class="row"><button class="outline" onclick="view='home';render()">Forsiden</button>${i<topics.length-1?`<button class="primary" onclick="i++;render()">Neste →</button>`:''}</div></article>`}else if(view==='terms'){let t=terms[i];app.innerHTML=`<section class="card"><p class="muted">Kort ${i+1}/${terms.length}</p><button class="flash" onclick="flip=!flip;render()">${flip?t[1]:t[0]}</button><div class="row"><button class="outline" onclick="i=(i-1+terms.length)%terms.length;flip=false;render()">Forrige</button><button class="primary" onclick="i=(i+1)%terms.length;flip=false;render()">Neste</button><button class="outline" onclick="view='home';render()">Forsiden</button></div></section>`}else if(view==='quiz'){let q=quiz[i];app.innerHTML=`<section class="card"><p>Spørsmål ${i+1}/${quiz.length} • ${score} poeng</p><div class="progress"><div class="bar" style="width:${(i+1)/quiz.length*100}%"></div></div><h2>${q[0]}</h2>${q[1].map((o,x)=>`<button class="choice ${pick===null?'':x===q[2]?'right':pick===x?'wrong':''}" onclick="choose(${x})">${o}</button>`).join('')}${pick!==null?`<button class="primary" onclick="next()">Neste →</button>`:''}</section>`}else app.innerHTML=`<section class="card"><h2>Resultat: ${score}/${quiz.length}</h2><p>${score>=5?'God kontroll. Gå videre til fordypning.':'Ta en ny runde med temaene og prøv igjen.'}</p><a class="btn primary" href="fordypning.html">Gå til fordypning</a></section>`}
function start(){view='quiz';i=0;score=0;pick=null;render()}function choose(x){if(pick!==null)return;pick=x;if(x===quiz[i][2])score++;render()}function next(){if(i+1===quiz.length)view='result';else{i++;pick=null}render()}render();</script><div class="footer">KRLE-opplegg for 8. klasse • Abraham og de abrahamittiske religionene</div></main></body></html>
