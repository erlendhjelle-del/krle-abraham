<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KRLE: Abraham - interaktiv oving</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1e293b;background:linear-gradient(#fffbeb,#fff);min-height:100vh}.wrap{max-width:780px;margin:auto;padding:24px}.head{display:flex;gap:14px;align-items:center;margin-bottom:28px}.icon{background:#fbbf24;padding:12px;border-radius:18px;font-size:26px}h1{margin:0;font-size:30px}p{line-height:1.5}.sub{margin:2px 0;color:#64748b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card,button.tile{background:#fff;border:0;border-radius:20px;box-shadow:0 5px 20px #00000012;padding:24px}.tile{text-align:left;color:inherit;cursor:pointer;font-size:16px}.tile:hover{box-shadow:0 7px 25px #0002}.wide{grid-column:1/-1;background:#eef2ff}.choices{display:grid;gap:10px}.choice{padding:15px;border:2px solid #e2e8f0;border-radius:14px;background:white;text-align:left;font-size:16px;cursor:pointer}.choice:hover{border-color:#818cf8}.good{border-color:#22c55e!important;background:#f0fdf4!important}.bad{border-color:#f87171!important;background:#fef2f2!important}.btn{border:0;border-radius:12px;padding:12px 18px;background:#4f46e5;color:white;cursor:pointer;font-size:16px}.secondary{background:white;color:#334155;border:1px solid #cbd5e1}.row{display:flex;gap:10px;margin-top:18px}.flash{min-height:220px;width:100%;border:0;border-radius:18px;background:#eef2ff;padding:28px;font-size:28px;font-weight:700;cursor:pointer}.muted{color:#64748b}.progress{height:8px;background:#f1f5f9;border-radius:20px;overflow:hidden}.bar{height:100%;background:#fbbf24}.feedback{margin-top:18px;padding:16px;border-radius:14px}.center{text-align:center}footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:30px}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.wrap{padding:16px}h1{font-size:25px}}
</style></head><body><main class="wrap"><header class="head"><div class="icon">📖</div><div><h1>KRLE: Abraham</h1><p class="sub">Øving for 8. klasse</p></div></header><div id="app"></div><footer>En enkel øvingsside. Prøv også å forklare svarene med egne ord.</footer></main>
<script>
const qs=[
["Hva betyr det at en religion er monoteistisk?",["Man tror på mange guder","Man tror på én Gud","Man har ingen gud","Man tror bare på profeter"],1,"Monoteisme betyr troen på én Gud. Jødedom, kristendom og islam regnes som monoteistiske religioner."],
["Hvilke tre religioner kalles de abrahamittiske religionene?",["Jødedom, kristendom og islam","Hinduisme, buddhisme og islam","Kristendom, hinduisme og jødedom","Jødedom, buddhisme og kristendom"],0,"Jødedom, kristendom og islam kalles abrahamittiske fordi Abraham er en viktig person og stamfar i tradisjonene."],
["Hva er en pakt?",["Et offer","En hellig bygning","En avtale eller et løfte mellom parter","En profet"],2,"En pakt er en avtale eller et løfte mellom parter."],
["Hva lovet Gud Abraham?",["At han skulle bli konge","At han skulle få en stor slekt","At han aldri skulle reise","At han skulle bygge et tempel"],1,"Et sentralt poeng i pakten er Guds løfte til Abraham om en stor slekt."],
["Hva het Abrahams to sønner som er viktige i fortellingene?",["Moses og Isak","Isak og Ismael","Ismael og David","Isak og Jesus"],1,"Isak og Ismael er Abrahams sønner og viktige i fortellingene om Abraham."],
["Hva skjer i offerhistorien før Isak blir ofret?",["En engel stopper Abraham","Isak rømmer","Abraham ombestemmer seg med en gang","Moses stopper ham"],0,"I fortellingen blir Abraham stoppet av en engel før Isak blir ofret."]];
const terms=[["Pakt","En avtale eller et løfte mellom parter."],["Monoteist","En som tror på én Gud."],["Stamfar","En person som regnes som opphav til en slekt eller et folk."],["Profet","En person som formidler et budskap fra Gud."],["Åpenbaring","At noe guddommelig blir gjort kjent for mennesker."],["Offer","Noe som gis eller ofres til Gud."],["Det gamle testamentet","Den første hoveddelen av den kristne Bibelen, med tekster som også har røtter i jødisk tradisjon."],["Mosebøkene","De fem første bøkene i Bibelen."]];
let mode='home',i=0,picked=null,score=0,ti=0,flip=false;const app=document.getElementById('app');
function render(){if(mode==='home') app.innerHTML=`<div class="grid"><button class="tile" onclick="mode='learn';render()"><h2>📚 Begrepskort</h2><p>Øv på de viktigste ordene før du tester deg selv.</p></button><button class="tile" onclick="restart()"><h2>🧠 Mini-prøve</h2><p>${qs.length} spørsmål med forklaring etter hvert svar.</p></button><section class="card wide"><h2>Dette bør sitte</h2><ul><li>Hva abrahamittiske religioner er</li><li>Historien om Abraham</li><li>Pakten mellom Gud og Abraham</li><li>Isak og Ismael</li><li>Offerhistorien</li><li>Hvorfor Abraham er viktig i jødedom, kristendom og islam</li></ul></section></div>`;
else if(mode==='learn'){app.innerHTML=`<div class="card center"><p class="muted">Kort ${ti+1} av ${terms.length}</p><button class="flash" onclick="flip=!flip;render()">${flip?terms[ti][1]:terms[ti][0]}</button><p class="muted">Trykk på kortet for å snu det.</p><div class="row"><button class="btn secondary" style="flex:1" onclick="ti=(ti-1+terms.length)%terms.length;flip=false;render()">Forrige</button><button class="btn" style="flex:1" onclick="ti=(ti+1)%terms.length;flip=false;render()">Neste</button></div><button class="btn secondary" style="margin-top:16px" onclick="mode='home';render()">Til forsiden</button></div>`}
else if(mode==='quiz'){let q=qs[i];app.innerHTML=`<div class="card"><div class="muted">Spørsmål ${i+1}/${qs.length} &nbsp; • &nbsp; Poeng: ${score}</div><div class="progress" style="margin:14px 0 22px"><div class="bar" style="width:${(i+1)/qs.length*100}%"></div></div><h2>${q[0]}</h2><div class="choices">${q[1].map((o,x)=>`<button class="choice ${picked===null?'':x===q[2]?'good':picked===x?'bad':''}" onclick="pick(${x})">${o}</button>`).join('')}</div>${picked===null?'':`<div class="feedback ${picked===q[2]?'good':'bad'}"><b>${picked===q[2]?'✅ Riktig!':'❌ Ikke helt.'}</b><p>${q[3]}</p><button class="btn" onclick="next()">Neste →</button></div>`}</div>`}
else{let pct=Math.round(score/qs.length*100);app.innerHTML=`<div class="card center"><div style="font-size:52px">🏆</div><h2>Resultat: ${score}/${qs.length}</h2><h3>${pct}%</h3><p>${pct>=80?'Dette sitter godt. Ta begrepskortene én siste gang.':'God trening. Gå gjennom begrepskortene og prøv igjen etterpå.'}</p><div class="row" style="justify-content:center"><button class="btn" onclick="restart()">↻ Prøv igjen</button><button class="btn secondary" onclick="mode='home';render()">Forsiden</button></div></div>`}}
function restart(){i=0;picked=null;score=0;mode='quiz';render()}function pick(x){if(picked!==null)return;picked=x;if(x===qs[i][2])score++;render()}function next(){if(i+1>=qs.length)mode='result';else{i++;picked=null}render()}render();
</script></body></html>
