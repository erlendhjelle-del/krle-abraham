<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRLE: Abraham og de abrahamittiske religionene</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f3ea;color:#263238}.wrap{max-width:980px;margin:auto;padding:20px}.hero{background:#264653;color:white;border-radius:30px;padding:34px;margin-bottom:22px;box-shadow:0 8px 24px #0002}.hero small{color:#e9c46a;font-weight:800}.hero h1{font-size:clamp(30px,5vw,48px);margin:8px 0}.hero p{color:#dbe5e8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.tile{background:white;border:0;border-radius:24px;padding:24px;box-shadow:0 5px 20px #0001}.tile{text-align:left;cursor:pointer;color:inherit;font-size:16px}.tile:hover{transform:translateY(-2px)}.tile h2{margin:12px 0 6px}.icon{font-size:30px}.plan{background:#e9c46a44;margin-top:18px}.plan-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mini{background:#ffffffcc;border-radius:16px;padding:14px}.nav6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px}.nav6 button,.btn{border:0;border-radius:12px;padding:12px;font-weight:700;cursor:pointer}.nav6 button{background:white}.nav6 .active,.btn.primary{background:#264653;color:white}.topic h2{font-size:32px;margin:6px 0}.label{color:#2a9d8f;font-weight:800}.points{padding:0;list-style:none}.points li{margin:12px 0;padding-left:30px;position:relative}.points li:before{content:'✓';position:absolute;left:0;color:#2a9d8f;font-weight:900}.task{background:#f4a26133;border-radius:18px;padding:18px;margin-top:22px}.row{display:flex;gap:10px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}.flash{width:100%;min-height:250px;background:#2a9d8f18;border:0;border-radius:24px;font-size:clamp(23px,4vw,34px);font-weight:800;padding:30px;cursor:pointer}.center{text-align:center}.muted{color:#66757d}.progress{height:9px;background:#edf0f1;border-radius:20px;overflow:hidden;margin:13px 0 24px}.bar{height:100%;background:#e9c46a}.choices{display:grid;gap:11px}.choice{background:white;border:2px solid #dde4e6;border-radius:15px;padding:15px;text-align:left;font-size:16px;cursor:pointer}.choice:hover{border-color:#2a9d8f}.good{border-color:#22a06b!important;background:#effbf5!important}.bad{border-color:#e05d5d!important;background:#fff1f1!important}.feedback{padding:17px;border-radius:15px;margin-top:18px}.score{font-size:48px;font-weight:900;margin:8px}.homebtn{background:transparent;border:0;cursor:pointer;padding:12px}.hidden{display:none}footer{text-align:center;color:#87959c;font-size:12px;padding:25px}@media(max-width:700px){.grid,.plan-grid{grid-template-columns:1fr}.nav6{grid-template-columns:repeat(3,1fr)}.hero{padding:25px}.wrap{padding:12px}}
</style></head>
<body><main class="wrap">
<header class="hero"><small>KRLE • 8. KLASSE</small><h1>Abraham og de abrahamittiske religionene</h1><p>Les, forklar med egne ord, øv på begreper og test deg selv.</p></header>
<div id="app"></div><footer>Studieopplegg for KRLE. Bruk egne ord når du øver muntlig.</footer>
</main>
<script>
const topics=[
{title:'Abrahamittiske religioner',text:'Jødedom, kristendom og islam kalles abrahamittiske religioner fordi Abraham har en viktig plass i alle tre tradisjonene.',points:['Alle tre er monoteistiske religioner.','De har historiske og religiøse røtter knyttet til Abraham.','De har både likheter og forskjeller i hvordan Abraham og fortellingene forstås.'],ask:'Forklar med egne ord hvorfor jødedom, kristendom og islam kalles abrahamittiske religioner.'},
{title:'Historien om Abraham',text:'Abraham er en sentral person i fortellingene. Gud kaller Abraham, og Abraham reiser videre med familien sin. Fortellingene handler blant annet om tro, tillit, løfter og slekt.',points:['Abraham blir kalt av Gud.','Abraham følger kallet og reiser videre.','Gud lover Abraham en stor slekt.','Abraham blir regnet som stamfar i flere religiøse tradisjoner.'],ask:'Fortell historien om Abraham sammenhengende på 1–2 minutter uten å se på teksten.'},
{title:'Pakten mellom Gud og Abraham',text:'En pakt er en avtale eller et løfte mellom parter. Pakten mellom Gud og Abraham er et viktig tema i Abraham-fortellingene.',points:['Gud gir Abraham løfter.','Et sentralt løfte gjelder en stor slekt.','Pakten viser forholdet mellom Gud, Abraham og etterkommerne hans.'],ask:'Hva er en pakt, og hva betyr pakten mellom Gud og Abraham?'},
{title:'Isak og Ismael',text:'Isak og Ismael er sønner av Abraham og sentrale i fortellingene om slekten hans. Fortellingene om dem har ulik vekt og betydning i de religiøse tradisjonene.',points:['Begge er sønner av Abraham.','Isak har en særlig viktig rolle i den bibelske fortellingen om pakten og slekten.','Ismael har en viktig plass i islamsk tradisjon.'],ask:'Hvem er Isak og Ismael, og hvorfor er de viktige når vi lærer om Abraham?'},
{title:'Offerhistorien',text:'I den bibelske fortellingen blir Abraham satt på en svært vanskelig prøve: Han blir bedt om å ofre Isak. Før offeret skjer, blir Abraham stoppet. Fortellingen brukes til å drøfte tro, lydighet og tillit.',points:['Abraham blir satt på prøve.','Isak skal ofres i den bibelske fortellingen.','En engel stopper Abraham før offeret gjennomføres.','Fortellingen reiser vanskelige spørsmål om tro og lydighet.'],ask:'Gjenfortell offerhistorien. Hva tror du fortellingen prøver å si om Abraham?'},
{title:'Abraham i tre religioner',text:'Abraham er viktig i jødedom, kristendom og islam, men tradisjonene legger vekt på ulike sider ved Abraham og familien hans.',points:['Jødedom: Abraham regnes som en sentral stamfar og knyttes til pakten.','Kristendom: Abraham står som et viktig eksempel på tro og er del av den bibelske historien.','Islam: Abraham, Ibrahim, regnes som en viktig profet og et forbilde for troen på én Gud.'],ask:'Sammenlign Abraham i jødedom, kristendom og islam. Finn minst én likhet og én forskjell.'}
];
const terms=[['Pakt','En avtale eller et løfte mellom parter.'],['Monoteisme','Troen på én Gud.'],['Stamfar','En person som regnes som opphav til en slekt eller et folk.'],['Profet','En person som formidler et budskap fra Gud.'],['Åpenbaring','At noe guddommelig blir gjort kjent for mennesker.'],['Offer','Noe som gis eller ofres til Gud.'],['Det gamle testamentet','Den første hoveddelen av den kristne Bibelen.'],['Mosebøkene','De fem første bøkene i Bibelen.']];
const quiz=[['Hva betyr monoteisme?',['Tro på én Gud','Tro på mange guder','Ingen tro på Gud','Tro bare på profeter'],0],['Hvilke religioner kalles vanligvis de abrahamittiske?',['Jødedom, kristendom og islam','Kristendom, buddhisme og islam','Jødedom, hinduisme og islam','Hinduisme, buddhisme og kristendom'],0],['Hva er en pakt?',['En hellig bygning','En religiøs høytid','En avtale eller et løfte','En profet'],2],['Hva er et sentralt løfte Gud gir Abraham?',['At Abraham skal bli konge','At Abraham skal få en stor slekt','At Abraham aldri skal reise','At Abraham skal bygge et tempel'],1],['Hvem er Isak og Ismael?',['To profeter uten forbindelse til Abraham','To av Abrahams sønner','To konger','To av Mosebøkene'],1],['Hva skjer før offeret av Isak gjennomføres i den bibelske fortellingen?',['Moses griper inn','Isak forlater Abraham','En engel stopper Abraham','Abraham blir konge'],2],['Hva kalles Abraham ofte i islam?',['Ibrahim','Moses','David','Jakob'],0],['Hva betyr stamfar?',['En religiøs bygning','Opphav til en slekt eller et folk','En type offer','En hellig bok'],1],['Hva er Mosebøkene?',['Fem kristne høytider','De fem første bøkene i Bibelen','Fem profeter','Fem pakter'],1],['Hva har de tre abrahamittiske religionene blant annet til felles?',['De er monoteistiske','De har helt like hellige skrifter','De forteller alle historiene helt likt','De oppstod samtidig'],0]];
let view='home',topic=0,term=0,flip=false,qi=0,pick=null,score=0;const app=document.getElementById('app');
function render(){
if(view==='home')app.innerHTML=`<section class="grid"><button class="tile" onclick="view='topics';render()"><div class="icon">📖</div><h2>Lær punkt 1–6</h2><p>Seks korte kapitler med nøkkelpunkter og muntlige oppgaver.</p></button><button class="tile" onclick="view='terms';render()"><div class="icon">⭐</div><h2>Begrepskort</h2><p>Åtte ord som bør sitte før prøven.</p></button><button class="tile" onclick="startQuiz()"><div class="icon">🧠</div><h2>Prøvemodus</h2><p>10 spørsmål med umiddelbar tilbakemelding.</p></button></section><section class="card plan"><h2>Smart økt på ca. 45 minutter</h2><div class="plan-grid"><div class="mini"><b>15 min</b><br>Punkt 1–6</div><div class="mini"><b>10 min</b><br>Begrepskort</div><div class="mini"><b>15 min</b><br>Prøvemodus</div><div class="mini"><b>5 min</b><br>Forklar høyt</div></div></section>`;
else if(view==='topics'){let t=topics[topic];app.innerHTML=`<div class="nav6">${topics.map((_,x)=>`<button class="${x===topic?'active':''}" onclick="topic=${x};render()">${x+1}</button>`).join('')}</div><article class="card topic"><div class="label">PUNKT ${topic+1} AV 6</div><h2>${t.title}</h2><p>${t.text}</p><h3>Dette bør du kunne</h3><ul class="points">${t.points.map(p=>`<li>${p}</li>`).join('')}</ul><div class="task"><b>🎤 Forklar uten å se:</b><p>${t.ask}</p></div><div class="row"><button class="homebtn" onclick="view='home';render()">← Forsiden</button>${topic<5?`<button class="btn primary" onclick="topic++;render()">Neste punkt →</button>`:''}</div></article>`}
else if(view==='terms')app.innerHTML=`<section class="card center"><p class="muted">Kort ${term+1} av ${terms.length}</p><button class="flash" onclick="flip=!flip;render()">${flip?terms[term][1]:terms[term][0]}</button><p class="muted">Tenk på svaret før du snur kortet.</p><div class="row" style="justify-content:center"><button class="btn" onclick="term=(term-1+terms.length)%terms.length;flip=false;render()">Forrige</button><button class="btn primary" onclick="term=(term+1)%terms.length;flip=false;render()">Neste</button></div><button class="homebtn" onclick="view='home';render()">← Forsiden</button></section>`;
else if(view==='quiz'){let q=quiz[qi];app.innerHTML=`<section class="card"><div class="row" style="margin:0"><span>Spørsmål ${qi+1}/${quiz.length}</span><span>${score} poeng</span></div><div class="progress"><div class="bar" style="width:${(qi+1)/quiz.length*100}%"></div></div><h2>${q[0]}</h2><div class="choices">${q[1].map((o,x)=>`<button class="choice ${pick===null?'':x===q[2]?'good':pick===x?'bad':''}" onclick="choose(${x})">${o}</button>`).join('')}</div>${pick===null?'':`<div class="feedback ${pick===q[2]?'good':'bad'}"><b>${pick===q[2]?'✅ Riktig!':'❌ Ikke helt. Se på riktig svar over.'}</b><br><button class="btn primary" style="margin-top:12px" onclick="next()">Neste spørsmål →</button></div>`}</section>`}
else{let pct=Math.round(score/quiz.length*100);app.innerHTML=`<section class="card center"><div style="font-size:58px">🏆</div><div class="score">${score}/${quiz.length}</div><h2>${pct}%</h2><p>${pct>=80?'Sterkt! Nå bør du øve på å forklare punkt 1–6 med egne ord.':'Bra jobbet. Gå gjennom punkt 1–6 og begrepskortene én gang til, og prøv igjen.'}</p><div class="row" style="justify-content:center"><button class="btn primary" onclick="startQuiz()">↻ Prøv igjen</button><button class="btn" onclick="view='home';render()">Forsiden</button></div></section>`}}
function startQuiz(){qi=0;pick=null;score=0;view='quiz';render()} function choose(x){if(pick!==null)return;pick=x;if(x===quiz[qi][2])score++;render()} function next(){if(qi+1===quiz.length)view='result';else{qi++;pick=null}render()} render();
</script></body></html>
